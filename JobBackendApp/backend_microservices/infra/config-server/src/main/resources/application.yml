# Serves every service's settings from src/main/resources/config (native backend).
# config/application.yml is shared; config/<service-name>.yml is per service.
server:
  port: 8888
spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config
management:
  endpoints.web.exposure.include: health,info
